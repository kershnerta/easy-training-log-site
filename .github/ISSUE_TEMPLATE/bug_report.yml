name: Report a problem
description: Ask for help with Easy Training Log or report reproducible behavior.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Easy Training Log. Do not include passwords, dates of birth, private health details, workout exports, or other sensitive personal information.
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: Find this in Easy Training Log under Settings → About.
      placeholder: 1.0.0 (25)
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: iOS 27.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Briefly describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that reliably show the problem, if known.
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: false
